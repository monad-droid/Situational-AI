[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "situational-ai"
version = "0.1.0"
description = "A situational AI health coach that runs entirely on your machine using your own API credits"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "anthropic>=0.39.0",
    "openai>=1.50.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "schedule>=1.2.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.scripts]
situational-ai = "situational_ai.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]
